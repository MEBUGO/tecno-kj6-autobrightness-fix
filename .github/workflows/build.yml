name: Build Flashable Zip

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Package Module Zip
        run: |
          MOD_VER=$(grep '^version=' module.prop | cut -d= -f2)
          ZIP_NAME="TECNO-KJ6-AutoBrightness-Fix-${MOD_VER}.zip"
          zip -r9 "${ZIP_NAME}" . -x ".git*" -x ".github*" -x "*.zip" -x "*.md" -x "LICENSE"
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}

      - name: Create Release (Tags Only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
