# TECNO KJ6 Auto-Brightness Configuration
# Ayarları istediğiniz gibi düzenleyebilirsiniz.

# Zifiri karanlıkta minimum parlaklık (1 - 50, varsayılan: 8)
MIN_BRIGHTNESS=8

# Güneş ışığı altında maksimum parlaklık (100 - 255, varsayılan: 255)
MAX_BRIGHTNESS=255

# Genel parlaklık kaydırma ofseti (+ daha parlak, - daha loş)
BRIGHTNESS_OFFSET=0

# Sensör yoklama aralığı saniye cinsinden (varsayılan: 1.5)
POLLING_INTERVAL=1.5

# Hızlı Ayarlar (QS) panelinde otomatik parlaklık tuşunu zorunlu aktif et (1 = Açık, 0 = Kapalı)
FORCE_QS_AUTO_BUTTON=1
